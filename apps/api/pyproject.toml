[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-osint-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
