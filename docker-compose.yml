services:
  api:
    build: ./apps/api
    environment:
      VIGIL_DB_PATH: /data/vigil.db
      VIGIL_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"
